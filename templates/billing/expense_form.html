{% extends 'base.html' %}
{% block title %}Record New Hospital Expense{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-wallet2 text-danger me-2"></i>Record New Expense</h4>
        <p class="text-muted mb-0">Record debit vouchers, vendor payments, utilities and maintenance costs</p>
    </div>
    <a href="{% url 'expense_list' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back to Expenses
    </a>
</div>

<div class="card card-custom">
    <div class="card-body p-4">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Expense Category <span class="text-danger">*</span></label>
                    <select name="category" class="form-select" required>
                        <option value="">-- Choose Expense Head --</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Expense Title / Description <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. September Generator Diesel (50 Liters)" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Amount <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" min="0.01" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Expense Date</label>
                    <input type="date" name="expense_date" value="{{ today }}" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label fw-semibold">Payment Mode</label>
                    <select name="payment_method" class="form-select">
                        <option value="Cash">Cash</option>
                        <option value="Bank">Bank Transfer / Cheque</option>
                        <option value="bKash">bKash</option>
                        <option value="Nagad">Nagad</option>
                        <option value="Card">Card</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Paid To / Recipient / Vendor Name</label>
                    <input type="text" name="paid_to" class="form-control" placeholder="e.g. Dhaka Power Distribution Company / Vendor Name">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Upload Voucher / Receipt Slip (Optional)</label>
                    <input type="file" name="voucher_receipt" class="form-control" accept="image/*,.pdf">
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Additional Remarks / Notes</label>
                    <textarea name="remarks" class="form-control" rows="2" placeholder="Voucher reference number or approval details..."></textarea>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 border-top pt-3 mt-4">
                <a href="{% url 'expense_list' %}" class="btn btn-light border px-4">Cancel</a>
                <button type="submit" class="btn btn-danger px-5 fw-semibold shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> Save Expense Voucher
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
