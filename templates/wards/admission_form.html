{% extends 'base.html' %}
{% block title %}Admit Inpatient{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-door-open-fill text-primary me-2"></i>Inpatient Admission</h4>
        <p class="text-muted mb-0">Assign bed/cabin, supervising doctor and advance deposit</p>
    </div>
    <a href="{% url 'ward_bed_status' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back to Bed Matrix
    </a>
</div>

<div class="card card-custom">
    <div class="card-body p-4">
        <form method="POST">
            {% csrf_token %}
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Select Patient <span class="text-danger">*</span></label>
                    <select name="patient" class="form-select" required>
                        <option value="">-- Choose Registered Patient --</option>
                        {% for p in patients %}
                        <option value="{{ p.id }}" {% if pre_pat_id == p.id|stringformat:"i" %}selected{% endif %}>
                            {{ p.name }} ({{ p.phone }}) - ID: {{ p.patient_id }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Select Available Bed / Cabin <span class="text-danger">*</span></label>
                    <select name="bed" class="form-select" required>
                        <option value="">-- Choose Available Bed --</option>
                        {% for b in available_beds %}
                        <option value="{{ b.id }}" {% if pre_bed_id == b.id|stringformat:"i" %}selected{% endif %}>
                            {{ b.bed_number }} ({{ b.ward_type.name }} - {{ b.floor }}) - ৳{{ b.daily_charge }}/day
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Supervising Consultant Doctor <span class="text-danger">*</span></label>
                    <select name="doctor" class="form-select" required>
                        <option value="">-- Choose Doctor --</option>
                        {% for doc in doctors %}
                        <option value="{{ doc.id }}">Dr. {{ doc.name }} ({{ doc.specialization.name }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">Initial Advance Deposit</label>
                    <input type="number" step="0.01" name="initial_deposit" class="form-control" placeholder="0.00" value="0.00">
                </div>

                <div class="col-12">
                    <label class="form-label fw-semibold">Reason for Admission / Clinical Diagnosis</label>
                    <textarea name="reason_for_admission" class="form-control" rows="3" placeholder="e.g. Acute appendicitis scheduled for appendectomy..."></textarea>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 border-top pt-3 mt-4">
                <a href="{% url 'ward_bed_status' %}" class="btn btn-light border px-4">Cancel</a>
                <button type="submit" class="btn btn-primary px-5 fw-semibold shadow-sm">
                    <i class="bi bi-check2-circle me-1"></i> Confirm Inpatient Admission
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
